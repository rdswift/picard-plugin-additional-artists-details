"manifest.description" = "Ce plugin fournit des variables spécifiques aux albums et aux morceaux, ainsi que des informations sur les artistes, destinées à être utilisées dans les scripts de balisage et de nommage."
"manifest.long_description" = "Ce plugin fournit des variables spécialisées pour les albums et les pistes, ainsi que des informations sur les artistes, destinées à être utilisées dans les scripts de balisage et de nommage. Notez que cela génère\ndes appels supplémentaires à l'API MusicBrainz pour obtenir les informations sur les artistes et la région, ce qui ralentit le traitement. Ce ralentissement sera particulièrement\nperceptible lorsqu'il y a de nombreux artistes différents pour les albums ou les pistes, comme c'est le cas sur un album [Various Artists]. Une option permet de désactiver le traitement des\nartistes de pistes, ce qui peut augmenter considérablement la vitesse de traitement si vous ne vous intéressez qu'aux informations sur l'artiste de l'album.\n"
"manifest.name" = "Informations supplémentaires sur les artistes"
"qt.AdditionalArtistsDetailsCacheEditor.artists_list.title" = "Artistes dans le Cache"
"qt.AdditionalArtistsDetailsCacheEditor.button.cancel" = "Annuler"
"qt.AdditionalArtistsDetailsCacheEditor.button.remove" = "Supprimer"
"qt.AdditionalArtistsDetailsCacheEditor.label.filter" = "Filtre :"
"qt.AdditionalArtistsDetailsCacheEditor.page.description" = "Cet éditeur vous permet de supprimer un ou plusieurs artistes du cache actuel afin qu'ils soient mis à jour avec les nouvelles données la prochaine fois qu'ils apparaîtront sur un album chargé depuis MusicBrainz. Notez que cela entraînera des appels supplémentaires à l'API et pourra ralentir le chargement de l'album.\n\nÉtant donné que les informations relatives à la région entraînent de nombreux appels supplémentaires à l'API, ce qui se traduit par des retards importants, et que ces informations changent rarement, les éléments relatifs à la région ne peuvent pas être supprimés du cache à l'aide de cet éditeur."
"qt.AdditionalArtistsDetailsCacheEditor.page.title" = "Éditeur de cache des informations supplémentaires sur les artistes"
