"qt.AdditionalArtistsDetailsOptionsPage.section.background_processing.text" = "系统可以通过在后台提交 API 请求来尝试填写缺失的区域信息，并自动删除指定天数前的艺术家记录，以便下次使用时刷新它们。"
"qt.AdditionalArtistsDetailsOptionsPage.section.background_processing.title" = "后台缓存处理"
"qt.AdditionalArtistsDetailsOptionsPage.section.cache.text" = "区域信息（可选）艺术家信息保存到持久缓存文件中，以便在 Picard 会话之间保留。这可以显著减少加载专辑所需的时间，通过消除不必要的 API 调用，这些信息已经检索过。区域信息通常提供最多的 API 调用，因此是加载专辑时延迟的最大贡献者。为此，区域信息始终保存到持久缓存文件中。"
"qt.AdditionalArtistsDetailsOptionsPage.section.cache.title" = "持久化缓存"
"qt.AdditionalArtistsDetailsOptionsPage.section.include.text" = "这些选项决定是否在创建的艺术家位置变量中包含县、市和区划信息。无论这些设置如何，如果县、市或区划是艺术家指定的区域，则此信息将被包含。"
"qt.AdditionalArtistsDetailsOptionsPage.section.include.title" = "包含地区详情"
"qt.AdditionalArtistsDetailsOptionsPage.section.process.text" = "此选项决定是否检索发行品上所有音轨艺术家的详细信息。如果您只对专辑艺术家的详细信息感兴趣，则应禁用此选项，从而显著减少对 MusicBrainz API 的额外调用次数，并减少加载发行品所需的时间。专辑艺术家始终被处理。"
