"manifest.description" = "此插件提供具有艺术家详细信息的专用专辑和音轨变量，用于标签和命名脚本。"
"manifest.long_description" = "此插件提供具有艺术家详细信息的专用专辑和音轨变量，用于标签和命名脚本。请注意，这会为艺术家和地区信息创建额外的 MusicBrainz API 调用，并会减慢处理速度。当有大量不同的专辑或音轨艺术家时，例如在 [Various Artists] 发行品上，这种情况会特别明显。有一个选项可以禁用音轨艺术家处理，如果您只对专辑艺术家详细信息感兴趣，这可以显著提高处理速度。\n"
"manifest.name" = "附加艺术家详细信息"
