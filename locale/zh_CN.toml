"qt.AdditionalArtistsDetailsCacheEditor.page.description" = "此编辑器允许您从当前缓存中删除一个或多个艺术家，以便在下次它们出现在从 MusicBrainz 加载的专辑上时，它们将使用更新的数据刷新。请注意，这会导致额外的 API 调用，并可能减慢加载专辑的速度。\n\n由于地区信息会导致大量额外的 API 调用，从而导致显著延迟，并且信息很少变化，因此地区信息项无法使用此编辑器从缓存中删除。"
