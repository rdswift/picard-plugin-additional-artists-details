"qt.AdditionalArtistsDetailsCacheEditor.page.description" = "This editor allows you to remove one or more artists from the current cache so that they will be refreshed with any updated data the next time they appear on an album loaded from MusicBrainz. Note that this will cause additional calls to the API, and may slow down loading the album.\n\nBecause the area information causes numerous additional calls to the API resulting in significant delays, and because the information rarely changes, the area information items cannot be removed from the cache with this editor."
"qt.AdditionalArtistsDetailsCacheEditor.page.title" = "Additional Artists Details Cache Editor"
