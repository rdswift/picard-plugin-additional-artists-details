"qt.AdditionalArtistsDetailsOptionsPage.page.description" = "These settings will determine how the **Additional Artists Details** plugin operates."
"qt.AdditionalArtistsDetailsOptionsPage.page.title" = "Additional Artists Details"
"qt.AdditionalArtistsDetailsOptionsPage.section.background_processing.text" = "The system can attempt to fill in missing area information by submitting API requests in the background."
"qt.AdditionalArtistsDetailsOptionsPage.section.background_processing.title" = "Cache Background Processing"
"qt.AdditionalArtistsDetailsOptionsPage.section.cache.text" = "Area and (optionally) artist information is saved to a persistent cache file so that it is retained between Picard sessions. This can significantly reduce the time required to load an album by eliminating unnecessary API calls for information already retrieved. Area information usually provides the most additional API calls, and thus is the largest contributor to delays when loading an album. For this reason, area information is always saved to the persistent cache file."
"qt.AdditionalArtistsDetailsOptionsPage.section.cache.title" = "Persistent Cache"
"qt.AdditionalArtistsDetailsOptionsPage.section.include.text" = "These options determine whether or not County, Municipality and Subdivision information is included in the artist location variables created. Regardless of these settings, this information will be included if a County, Municipality or Subdivision is the area specified for an artist."
"qt.AdditionalArtistsDetailsOptionsPage.section.include.title" = "Include Area Details"
"qt.AdditionalArtistsDetailsOptionsPage.section.process.text" = "This option determines whether or not details are retrieved for all track artists on the release. If you are only interested in details for the album artists then this should be disabled, thus significantly reducing the number of additional calls made to the MusicBrainz API and reducing the time required to load a release.  Album artists are always processed."
"qt.AdditionalArtistsDetailsOptionsPage.section.process.title" = "Process Track Artists"
