"qt.AdditionalArtistsDetailsCacheEditor.tooltip.filter_previous" = "Move to previous matching item."
"qt.AdditionalArtistsDetailsCacheEditor.tooltip.filter_text" = "Enter text to use to quickly locate matching entries in the artists list."
