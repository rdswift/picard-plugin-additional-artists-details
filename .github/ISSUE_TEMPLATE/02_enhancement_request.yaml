name: Feature Request
description: Request an enhancement or new feature.
title: "[Feature]: "
labels: ["enhancement"]
type: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature or enhancement request!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Is there an existing request for this?
      description: Please search to see if an issue already exists for the feature or enhancement you are requesting.
      options:
      - label: I have searched the existing issues
        required: true
  - type: textarea
    attributes:
      label: Requested feature or enhancement
      description: A concise description of what you would like to see added or improved.
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Any additional information we should know?
      placeholder: Is there anything else that might help us implement the requested changes?
      value: "No additional information."
    validations:
      required: false
  - type: upload
    id: screenshots
    attributes:
      label: Upload imagess
      description: If applicable, add screenshots or images to help explain your request.
    validations:
      required: false
